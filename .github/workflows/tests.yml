name: Workbench checks
on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '.github/workflows/tests.yml'
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic demo
        run: python lab.py
      - name: Independent assertions
        run: python -m unittest discover -v
